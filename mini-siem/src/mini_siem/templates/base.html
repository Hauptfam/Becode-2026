<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}mini-SIEM{% endblock %}</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c232d; --line: #2a3340; --text: #e6edf3;
    --muted: #8b98a8; --accent: #4cc9f0; --link: #79c0ff;
    --critical: #ff4d6d; --high: #ff8c42; --medium: #ffd166; --low: #4cc9f0;
    --malicious: #ff4d6d; --suspicious: #ff8c42; --clean: #3ddc97; --unknown: #8b98a8; --private: #4cc9f0;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 28px; padding: 0 24px; height: 52px;
           background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; letter-spacing: .02em; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .brand svg { color: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); padding: 6px 12px; border-radius: 6px; }
  nav a:hover { color: var(--text); background: var(--panel-2); text-decoration: none; }
  nav a.active { color: var(--text); background: var(--panel-2); }
  .count { background: var(--critical); color: #fff; border-radius: 9px; padding: 0 7px; font-size: 12px; margin-left: 4px; }
  .ti-flag { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  .pad { padding: 16px 18px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase;
       letter-spacing: .05em; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--panel-2); }
  .mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  .muted { color: var(--muted); }
  .nowrap { white-space: nowrap; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 700;
           letter-spacing: .04em; text-transform: uppercase; border: 1px solid currentColor; white-space: nowrap; }
  .sev-critical { color: var(--critical); } .sev-high { color: var(--high); }
  .sev-medium { color: var(--medium); }     .sev-low { color: var(--low); }
  .v-MALICIOUS { color: var(--malicious); } .v-SUSPICIOUS { color: var(--suspicious); }
  .v-CLEAN { color: var(--clean); } .v-UNKNOWN, .v-NONE { color: var(--unknown); } .v-PRIVATE { color: var(--private); }
  .status { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .status-new { color: var(--accent); font-weight: 600; }
  .bar { border-left: 3px solid var(--line); }
  .bar-critical { border-left-color: var(--critical); } .bar-high { border-left-color: var(--high); }
  .bar-medium { border-left-color: var(--medium); }     .bar-low { border-left-color: var(--low); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .card .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  select, input[type=text], textarea { background: var(--panel); color: var(--text); border: 1px solid var(--line);
       border-radius: 6px; padding: 6px 10px; font: inherit; }
  textarea { width: 100%; min-height: 70px; }
  button, .btn { background: var(--accent); color: #04121a; border: 0; border-radius: 6px; padding: 7px 14px;
       font-weight: 600; cursor: pointer; font: inherit; font-weight: 600; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .tag { display: inline-block; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
         padding: 0 6px; margin: 1px 2px 1px 0; font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto;
        font-family: var(--mono); font-size: 12px; margin: 8px 0 0; }
  .src { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .hl { background: rgba(255, 77, 109, .07); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .timeline td.time { width: 90px; }
  @media (max-width: 900px) {
    .grid2 { grid-template-columns: 1fr; }
    header { gap: 12px; padding: 0 16px; overflow-x: auto; } .ti-flag { display: none; }
    main { padding: 16px; }
    .hide-sm { display: none; }
    th, td { padding: 8px; }
    .cards { grid-template-columns: repeat(2, 1fr); }
    .filters select, .filters input[type=text] { min-width: 0 !important; flex: 1 1 140px; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('alerts') }}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>
    mini-SIEM
  </a>
  {% set ep = request.endpoint or '' %}
  <nav>
    <a href="{{ url_for('alerts') }}" class="{{ 'active' if ep.startswith('alert') }}">Alerts{% if open_alerts %}<span class="count">{{ open_alerts }}</span>{% endif %}</a>
    <a href="{{ url_for('events') }}" class="{{ 'active' if ep in ('events', 'host') }}">Events</a>
    <a href="{{ url_for('rules_page') }}" class="{{ 'active' if ep == 'rules_page' }}">Rules</a>
  </nav>
  <span class="ti-flag">Threat intel: {{ 'ioc-enricher' if enrichment_on else 'not installed' }}</span>
</header>
<main>
{% if error %}<div class="panel empty"><h1>{{ error }}</h1><p><a href="{{ url_for('alerts') }}">Back to alerts</a></p></div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
