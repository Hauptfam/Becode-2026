name: ioc-enricher CI

on:
  push:
    paths: ["ioc-enricher/**", ".github/workflows/ioc-enricher-ci.yml"]
  pull_request:
    paths: ["ioc-enricher/**", ".github/workflows/ioc-enricher-ci.yml"]

defaults:
  run:
    working-directory: ioc-enricher

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v
