[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-soar"
version = "1.0.0"
description = "Automated response playbooks for mini-SIEM alerts: blocklists, cases, notifications, analyst approvals and an audit trail"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# mini-siem and ioc-enricher (sibling folders) are installed separately: pip install -e ../ioc-enricher -e ../mini-siem
dependencies = ["pyyaml>=6.0", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mini-soar = "mini_soar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mini_soar = ["playbooks/*.yml", "allowlist.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../mini-siem/src", "../ioc-enricher/src"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mini_soar", "mini_siem", "ioc_enricher"]
